<title>굴포천 주말나들이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app; home = next outing + list, detail = day tabs + subway-style route line (7호선 olive) */
:root{
  --bg:#F5F6EE; --surface:#FFFFFF; --surface-2:#ECEEE2; --fg:#1D2115; --muted:#5F6652; --line:#D9DCCB;
  --accent:#6F7A00; --accent-ink:#FFFFFF; --accent-soft:#E6EAC2;
  --warn:#8A5A00; --warn-soft:#FBEBC4; --rest:#7A7F70;
  --font-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11130D; --surface:#1A1D14; --surface-2:#22261A; --fg:#ECEFE0; --muted:#A3A991; --line:#30352A;
  --accent:#B9C63C; --accent-ink:#151807; --accent-soft:#2D3312;
  --warn:#F2C25B; --warn-soft:#3A2E10; --rest:#8C9180; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11130D; --surface:#1A1D14; --surface-2:#22261A; --fg:#ECEFE0; --muted:#A3A991; --line:#30352A;
  --accent:#B9C63C; --accent-ink:#151807; --accent-soft:#2D3312;
  --warn:#F2C25B; --warn-soft:#3A2E10; --rest:#8C9180; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{font-size:24px}
.origin{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.origin i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-family:var(--font-mono);font-size:11px;font-weight:600}
.back{border:0;background:var(--surface-2);border-radius:999px;min-width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:18px}

/* hero: next outing */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;width:100%}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.hero h2{font-size:26px;line-height:1.2}
.dday{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 10px;font-family:var(--font-mono);font-weight:600;font-size:15px}
.dayrows{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.dayrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px dashed var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .d{font-family:var(--font-mono);font-size:13px;line-height:1.3}
.dayrow .d b{display:block;font-size:15px}
.dayrow .ev{min-width:0}
.dayrow .ev strong{display:block;font-weight:600;overflow-wrap:anywhere}
.dayrow .ev span{font-size:12.5px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.pick{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.pill.opt{border-color:var(--line);color:var(--muted)}
.pill.rest{background:var(--surface-2);color:var(--rest)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* list */
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-title h3{font-size:19px}
.plist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.pitem{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.pitem .cal{width:46px;text-align:center;border-radius:9px;background:var(--surface-2);padding:5px 0;font-family:var(--font-mono);line-height:1.15}
.pitem .cal small{display:block;font-size:10.5px;color:var(--muted)}
.pitem .cal b{font-size:17px}
.pitem .t{min-width:0}
.pitem .t strong{display:block;font-weight:600}
.pitem .t span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem.past{opacity:.72}
details.past-wrap summary{cursor:pointer;color:var(--muted);font-size:14px;padding-block:6px}
details.past-wrap .plist{margin-top:8px}

/* detail */
.plan-head{display:flex;flex-direction:column;gap:6px}
.plan-head h2{font-size:28px;line-height:1.15}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-width:92px}
.tab .mono{display:block;font-size:13px}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px}
.ev-title{font-size:23px;line-height:1.2}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rest-card{background:var(--surface-2);border-radius:var(--r);padding:20px 16px;text-align:center;color:var(--muted)}

.book{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.book li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.book li .pill{margin-top:2px}

/* route line timeline */
.route{list-style:none;margin:0;padding:0;position:relative}
.route li{display:grid;grid-template-columns:50px 22px 1fr;gap:8px;min-height:48px}
.route .tm{font-family:var(--font-mono);font-size:13px;font-weight:600;padding-top:1px;text-align:right}
.route .rail{position:relative;display:flex;justify-content:center}
.route .rail::before{content:"";position:absolute;top:0;bottom:0;width:5px;background:var(--accent);border-radius:3px}
.route li:first-child .rail::before{top:8px}
.route li:last-child .rail::before{bottom:calc(100% - 12px)}
.route .stop{position:relative;margin-top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.route li.ends .stop{background:var(--accent)}
.route .what{padding-bottom:14px;min-width:0}
.route .what strong{display:block;font-weight:600;overflow-wrap:anywhere}
.route .what span{font-size:13px;color:var(--muted);display:block}

ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:10px;align-items:center;padding:7px 2px;cursor:pointer;font-size:14.5px}
.checks input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.src{display:flex;flex-direction:column;gap:6px;font-size:13.5px;list-style:none;margin:0;padding:0}
.src a{overflow-wrap:anywhere}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;gap:8px}
.empty h2{font-size:21px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.skel{height:150px;border-radius:var(--r);background:var(--surface-2)}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="app" id="app">
  <header class="bar">
    <div style="flex:1;min-width:0">
      <h1>주말나들이</h1>
      <div class="origin"><i>7</i>굴포천역 출발 · 편도 1시간 이내</div>
    </div>
  </header>
  <div class="skel" aria-label="일정 불러오는 중"></div>
</div>

<script>
(function(){
  const WD = ['일','월','화','수','목','금','토'];
  const app = document.getElementById('app');
  const S = { plans: [], ready: false, unavailable: false, dayIdx: {} };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https?:\/\//i.test(String(u||'')) ? String(u) : null;
  const arr = v => Array.isArray(v) ? v : [];
  function todayKST(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
  function parts(iso){ const [y,m,d] = String(iso).split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d)); return {y,m,d,w:WD[dt.getUTCDay()],t:dt.getTime()}; }
  function md(iso){ const p = parts(iso); return p.m + '/' + p.d; }
  function range(a,b){ return a===b ? md(a)+' ('+parts(a).w+')' : md(a)+' ('+parts(a).w+') – '+md(b)+' ('+parts(b).w+')'; }
  function dday(start){ const n = Math.round((parts(start).t - parts(todayKST()).t)/86400000); return n>0 ? 'D-'+n : n===0 ? '오늘' : null; }
  function statusPill(s){ return s==='추천' ? '<span class="pill pick">추천</span>' : s==='쉬기' ? '<span class="pill rest">쉬기</span>' : '<span class="pill opt">'+esc(s||'선택')+'</span>'; }

  function loadChecks(id){ try{ return JSON.parse(localStorage.getItem('chk:'+id)||'[]'); }catch(e){ return []; } }
  function saveChecks(id,list){ try{ localStorage.setItem('chk:'+id, JSON.stringify(list)); }catch(e){} }

  const header = (back) => `
    <header class="bar">
      ${back ? '<button class="back" id="back" aria-label="목록으로">←</button>' : ''}
      <div style="flex:1;min-width:0">
        <h1>주말나들이</h1>
        <div class="origin"><i>7</i>굴포천역 출발 · 편도 1시간 이내</div>
      </div>
    </header>`;

  function planRowHTML(p, past){
    const days = arr(p.days);
    const pick = days.find(d=>d.status==='추천') || days[0] || {};
    const s = parts(p.startDate);
    return `<li><button class="pitem${past?' past':''}" data-open="${esc(p.id)}">
      <div class="cal"><small>${s.m}월</small><b>${s.d}</b></div>
      <div class="t"><strong>${esc(p.title)}</strong><span>${esc(pick.event || '일정 준비 중')}</span></div>
      <span class="mono small muted">${past ? '지난 일정' : (dday(p.startDate)||'진행 중')}</span>
    </button></li>`;
  }

  function renderHome(){
    const today = todayKST();
    const upcoming = S.plans.filter(p=>p.endDate>=today).sort((a,b)=>a.startDate.localeCompare(b.startDate));
    const past = S.plans.filter(p=>p.endDate<today).sort((a,b)=>b.startDate.localeCompare(a.startDate));
    let body = '';
    if (!S.ready) body = '<div class="skel" aria-label="일정 불러오는 중"></div>';
    else if (!S.plans.length) body = `<section class="empty">
        <h2>${S.unavailable ? '일정을 불러올 수 없어요' : '아직 저장된 일정이 없어요'}</h2>
        <p class="muted" style="margin:0">${S.unavailable ? 'claude.ai에 로그인한 상태에서 열면 저장된 일정이 보여요.' : '쉬는 날이 끝나는 날 밤 9시쯤, 다음 주말이나 휴일 일정이 여기에 올라와요.'}</p>
      </section>`;
    else {
      const next = upcoming[0];
      if (next){
        const dd = dday(next.startDate);
        body += `<button class="hero fade" data-open="${esc(next.id)}">
          <div class="hero-top">
            <div><div class="eyebrow">다음 나들이 · ${esc(range(next.startDate,next.endDate))}</div><h2>${esc(next.title)}</h2></div>
            <span class="dday">${esc(dd||'진행 중')}</span>
          </div>
          ${next.holidayNote ? `<div class="small muted">${esc(next.holidayNote)}</div>` : ''}
          <div class="dayrows">${arr(next.days).map(d=>{ const p=parts(d.date); return `
            <div class="dayrow"><div class="d"><b>${p.m}/${p.d}</b>${p.w}${d.holiday?' · '+esc(d.holiday):''}</div>
              <div class="ev"><strong>${esc(d.status==='쉬기' ? '집에서 쉬기' : d.event)}</strong>${d.travel && d.status!=='쉬기' ? `<span>${esc(d.travel)}</span>`:''}</div>
              ${statusPill(d.status)}</div>`; }).join('')}</div>
        </button>`;
      }
      if (upcoming.length>1) body += `<section class="section-title"><h3>이후 일정</h3><span class="small muted">${upcoming.length-1}개</span></section>
        <ul class="plist">${upcoming.slice(1).map(p=>planRowHTML(p,false)).join('')}</ul>`;
      if (!next) body += `<section class="empty"><h2>다가오는 일정이 아직 없어요</h2><p class="muted" style="margin:0">쉬는 날 마지막 날 밤 9시쯤 새 일정이 올라와요.</p></section>`;
      if (past.length) body += `<details class="past-wrap"><summary>지난 일정 ${past.length}개</summary><ul class="plist">${past.map(p=>planRowHTML(p,true)).join('')}</ul></details>`;
    }
    app.innerHTML = header(false) + body + `<p class="foot">일정은 매주 쉬는 날이 끝나는 밤 9시 무렵 Claude가 행사를 찾아 업데이트해요. 준비물 체크는 이 기기에만 저장돼요.</p>`;
  }

  function renderDetail(id){
    const p = S.plans.find(x=>x.id===id);
    if (!p){ location.hash=''; return renderHome(); }
    const days = arr(p.days);
    if (S.dayIdx[id]==null){ const i = days.findIndex(d=>d.status==='추천'); S.dayIdx[id] = i<0?0:i; }
    const di = Math.min(S.dayIdx[id], Math.max(days.length-1,0));
    const d = days[di] || {};
    const checks = loadChecks(id);
    const tabs = days.length>1 ? `<div class="tabs" role="tablist">${days.map((x,i)=>{ const q=parts(x.date); return `
      <button class="tab" role="tab" aria-selected="${i===di}" data-day="${i}"><span class="mono">${q.m}/${q.d} ${q.w}</span><span>${esc(x.status||'선택')}${x.holiday?' · '+esc(x.holiday):''}</span></button>`; }).join('')}</div>` : '';

    let dayBody;
    if (d.status==='쉬기' && !d.event){
      dayBody = `<div class="rest-card">이날은 쉬는 날로 비워 뒀어요.${d.summary?'<br>'+esc(d.summary):''}</div>`;
    } else {
      const facts = [['장소',d.place],['이동',d.travel],['시간',d.hours],['요금',d.fee]].filter(f=>f[1]);
      dayBody = `
      <section class="card fade">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${statusPill(d.status)}${d.holiday?`<span class="pill opt">${esc(d.holiday)}</span>`:''}</div>
        <h2 class="ev-title">${esc(d.event)}</h2>
        ${d.summary?`<p style="margin:0">${esc(d.summary)}</p>`:''}
        ${facts.length?`<dl class="facts">${facts.map(f=>`<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl>`:''}
      </section>
      ${arr(d.booking).length?`<section class="card"><h3>예약 · 접수</h3><ul class="book">${arr(d.booking).map(b=>`
        <li><span class="pill ${b.required?'warn':'opt'}">${esc(b.label||'현장')}</span><span>${esc(b.text)}</span></li>`).join('')}</ul></section>`:''}
      ${arr(d.timeline).length?`<section class="card"><h3>동선</h3><ol class="route">${arr(d.timeline).map((t,i,a)=>`
        <li class="${i===0||i===a.length-1?'ends':''}"><span class="tm">${esc(t.time)}</span><span class="rail"><span class="stop"></span></span>
          <div class="what"><strong>${esc(t.what)}</strong>${t.where?`<span>${esc(t.where)}</span>`:''}</div></li>`).join('')}</ol></section>`:''}
      ${arr(d.alternatives).length?`<section class="card"><h3>대안</h3><ul class="plain">${arr(d.alternatives).map(a=>`<li>${esc(a)}</li>`).join('')}</ul></section>`:''}
      ${arr(d.tips).length?`<section class="card"><h3>팁</h3><ul class="plain">${arr(d.tips).map(a=>`<li>${esc(a)}</li>`).join('')}</ul></section>`:''}`;
    }

    const prep = arr(p.prep);
    const unknowns = arr(p.unknowns);
    const sources = arr(p.sources).filter(s=>safeUrl(s.url));
    app.innerHTML = header(true) + `
      <section class="plan-head">
        <div class="eyebrow">${esc(range(p.startDate,p.endDate))}${dday(p.startDate)?' · '+esc(dday(p.startDate)):''}</div>
        <h2>${esc(p.title)}</h2>
        ${p.holidayNote?`<div class="small muted">${esc(p.holidayNote)}</div>`:''}
      </section>
      ${tabs}
      ${dayBody}
      ${prep.length?`<section class="card"><div class="section-title"><h3>준비물</h3><span class="small muted mono">${checks.length}/${prep.length}</span></div>
        <ul class="checks">${prep.map((x,i)=>`<li><label><input type="checkbox" id="chk-${esc(id)}-${i}" data-chk="${i}" ${checks.includes(i)?'checked':''}><span>${esc(x)}</span></label></li>`).join('')}</ul></section>`:''}
      ${unknowns.length?`<section class="card"><h3>확인 필요</h3><ul class="plain">${unknowns.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></section>`:''}
      ${sources.length?`<section class="card"><h3>출처</h3><ul class="src">${sources.map(s=>`<li><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a></li>`).join('')}</ul></section>`:''}
      ${p.updatedAt?`<p class="foot">업데이트 ${esc(p.updatedAt)}</p>`:''}`;
  }

  function render(){
    const m = location.hash.match(/^#plan-([\w.~-]+)$/);
    if (m && S.ready) renderDetail(m[1]); else renderHome();
  }

  app.addEventListener('click', e=>{
    const open = e.target.closest('[data-open]');
    if (open){ location.hash = 'plan-' + open.dataset.open; window.scrollTo(0,0); return; }
    if (e.target.closest('#back')){ location.hash = ''; window.scrollTo(0,0); return; }
    const tab = e.target.closest('[data-day]');
    if (tab){ const m = location.hash.match(/^#plan-([\w.~-]+)$/); if (m){ S.dayIdx[m[1]] = Number(tab.dataset.day); render(); } }
  });
  app.addEventListener('change', e=>{
    const c = e.target.closest('[data-chk]'); if (!c) return;
    const m = location.hash.match(/^#plan-([\w.~-]+)$/); if (!m) return;
    const i = Number(c.dataset.chk); let list = loadChecks(m[1]).filter(x=>x!==i);
    if (c.checked) list.push(i);
    saveChecks(m[1], list); render();
  });
  window.addEventListener('hashchange', render);

  render();
  (async ()=>{
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db){ S.ready = true; S.unavailable = true; render(); return; }
    db.collection('plans').onSnapshot(snap=>{
      S.plans = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(p=>p.startDate && p.endDate);
      S.ready = true; render();
    }, ()=>{ S.ready = true; S.unavailable = !S.plans.length; render(); });
  })();
})();
</script>
